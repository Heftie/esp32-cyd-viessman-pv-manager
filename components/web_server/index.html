<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 CYD</title>
<style>
  :root {
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --surface-2: #E8ECF2;
    --ink: #121822;
    --ink-muted: #5C6675;
    --border: rgba(18,24,34,0.10);
    --border-strong: rgba(18,24,34,0.22);
    --accent: #0E7C78;
    --accent-bg: rgba(14,124,120,0.09);
    --good: #2E7D46;
    --good-bg: rgba(46,125,70,0.10);
    --bad: #B3402A;
    --bad-bg: rgba(179,64,42,0.10);
    --shadow: rgba(18,24,34,0.07);
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141B;
      --surface: #161C26;
      --surface-2: #1E2530;
      --ink: #E6E9EF;
      --ink-muted: #97A3B6;
      --border: rgba(230,233,239,0.12);
      --border-strong: rgba(230,233,239,0.24);
      --accent: #63B8B5;
      --accent-bg: rgba(99,184,181,0.12);
      --good: #7FBD8A;
      --good-bg: rgba(127,189,138,0.14);
      --bad: #E08A73;
      --bad-bg: rgba(224,138,115,0.14);
      --shadow: rgba(0,0,0,0.4);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--font-body);
  }
  .page { max-width: 520px; margin: 0 auto; padding: 32px 20px 56px; }

  header.topbar { margin-bottom: 26px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 6px; }
  p.dek { color: var(--ink-muted); margin: 0; font-size: 14.5px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 20px 22px;
    box-shadow: 0 1px 2px var(--shadow);
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 600;
    margin: 0 0 16px;
  }

  .pill {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--surface-2);
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  footer.foot { margin-top: 12px; font-size: 12px; color: var(--ink-muted); text-align: center; }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <p class="eyebrow">ESP32 &middot; CYD</p>
    <h1>Device Status</h1>
    <p class="dek">A minimal starting point — wire up your own /api endpoints in components/web_server/web_server.c.</p>
  </header>

  <section class="card">
    <h2>Wall Clock</h2>
    <p class="stat-value" id="clock-value">Loading&hellip;</p>
    <p><span class="pill" id="clock-pill">--</span></p>
  </section>

  <footer class="foot">Served directly from the device &middot; no data leaves your LAN</footer>
</div>

<script>
async function refreshTime() {
  const valueEl = document.getElementById('clock-value');
  const pillEl = document.getElementById('clock-pill');
  try {
    const res = await fetch('/api/time');
    const data = await res.json();
    if (data.synced) {
      valueEl.textContent = new Date(data.epoch * 1000).toUTCString();
      pillEl.textContent = 'NTP synced';
      pillEl.className = 'pill good';
    } else {
      valueEl.textContent = '--';
      pillEl.textContent = 'Not synced yet';
      pillEl.className = 'pill bad';
    }
  } catch (e) {
    valueEl.textContent = '--';
    pillEl.textContent = 'Fetch failed';
    pillEl.className = 'pill bad';
  }
}
refreshTime();
setInterval(refreshTime, 1000);
</script>
</body>
</html>
