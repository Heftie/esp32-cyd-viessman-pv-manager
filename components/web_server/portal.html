<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYD Setup</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 32px 24px; background: #10141b; color: #e6e9ef; max-width: 360px;
         font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.sub { color: #97a3b6; margin: 0 0 24px; font-size: 13px; }
  label { display: block; font-size: 12px; color: #97a3b6; margin: 14px 0 4px; }
  input { width: 100%; box-sizing: border-box; background: #1a212c; border: 1px solid #2a3444;
          color: #e6e9ef; border-radius: 6px; padding: 9px 10px; font: inherit; }
  button { width: 100%; margin-top: 22px; background: #2a3444; border: 1px solid #3a4658;
           color: #e6e9ef; border-radius: 6px; padding: 10px; font: inherit; cursor: pointer; }
  button:hover { background: #34405480; }

  .net-list-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
  .net-list-head span { font-size: 12px; color: #97a3b6; }
  .link-btn { width: auto; margin: 0; padding: 0; background: none; border: none;
              color: #7fd1c9; font-size: 12px; text-decoration: underline; cursor: pointer; }
  .link-btn:hover { background: none; }
  .net-list { margin-top: 8px; max-height: 200px; overflow-y: auto; }
  .net-item { display: flex; justify-content: space-between; align-items: center; gap: 8px;
              padding: 9px 10px; background: #1a212c; border: 1px solid #2a3444; border-radius: 6px;
              margin-bottom: 6px; cursor: pointer; font-size: 13.5px; }
  .net-item:hover { background: #232c3a; }
  .net-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net-item .sig { font-family: ui-monospace, monospace; color: #7fd1c9; font-size: 12px; flex-shrink: 0; }
  p.hint { color: #97a3b6; font-size: 12.5px; margin: 8px 0 0; }
</style>
</head>
<body>
  <h1>Connect ESP32 CYD</h1>
  <p class="sub">Pick your WiFi network below, or enter it manually. The device will restart and try to join it.</p>

  <div class="net-list-head">
    <span>Nearby networks</span>
    <button type="button" id="rescan" class="link-btn">Rescan</button>
  </div>
  <div class="net-list" id="net-list"><p class="hint">Scanning&hellip;</p></div>

  <form method="POST" action="/api/wifi">
    <label for="ssid">Network name (SSID)</label>
    <input id="ssid" name="ssid" required maxlength="32" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="64" autocomplete="off">
    <button type="submit">Save &amp; Connect</button>
  </form>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// Coarse 1-4 bar signal indicator from RSSI (dBm) — good enough for
// picking the strongest of several same-named APs, not a precise reading.
function signalBars(rssi) {
  if (rssi >= -60) return '████';
  if (rssi >= -70) return '███░';
  if (rssi >= -80) return '██░░';
  return '█░░░';
}

async function scanNetworks() {
  const list = document.getElementById('net-list');
  list.innerHTML = '<p class="hint">Scanning&hellip;</p>';
  try {
    const res = await fetch('/api/scan');
    const nets = await res.json();

    // The same SSID can show up more than once (multiple APs/channels for
    // one network) — keep only the strongest reading of each.
    const bySsid = new Map();
    for (const n of nets) {
      const existing = bySsid.get(n.ssid);
      if (!existing || n.rssi > existing.rssi) {
        bySsid.set(n.ssid, n);
      }
    }
    const merged = [...bySsid.values()].sort((a, b) => b.rssi - a.rssi);

    if (!merged.length) {
      list.innerHTML = '<p class="hint">No networks found nearby — enter yours manually below.</p>';
      return;
    }

    list.innerHTML = '';
    for (const n of merged) {
      const el = document.createElement('div');
      el.className = 'net-item';
      el.innerHTML = `<span class="name">${n.secure ? '\u{1F512} ' : ''}${escapeHtml(n.ssid)}</span>` +
                     `<span class="sig">${signalBars(n.rssi)}</span>`;
      el.addEventListener('click', () => {
        document.getElementById('ssid').value = n.ssid;
        document.getElementById('password').focus();
      });
      list.appendChild(el);
    }
  } catch (e) {
    list.innerHTML = '<p class="hint">Scan failed — enter your network manually below.</p>';
  }
}

document.getElementById('rescan').addEventListener('click', scanNetworks);
scanNetworks();
</script>
</body>
</html>
